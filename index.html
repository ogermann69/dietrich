<style>
/* ==========================================================================
   Dietrich - Design-System
   Alle Farben stehen hier. An keiner anderen Stelle, auch nicht im Skript,
   wird ein Farbwert eingetragen; die Zeichenflaeche liest die Werte ueber
   getComputedStyle aus.
   ========================================================================== */

:root {
  /* Grundflaechen, "bruenierter Stahl" (Begruendung siehe Doku) */
  --df-schwarz:        #0C0E11;  /* Grundflaeche */
  --df-grau:           #1A1D21;  /* Karten, erhabene Flaechen */
  --df-linie:          #272A2F;  /* Trennlinien, Raender */

  --df-silber-dunkel:  #6E7278;  /* inaktive Elemente, Verlaufstiefen */
  --df-silber:         #B8BCC2;  /* Primaerakzent */
  --df-silber-hell:    #E8EAED;  /* Text primaer, Glanzlichter */
  --df-text-sekundaer: #8A8D91;  /* Beschriftungen, Hilfstexte */
  --df-warnung:        #C25B4A;  /* Zoom-Warnung und Abweichungspunkt */

  /* Mattenfarben der Zeichenflaeche, Guide Abschnitt 12. Gedeckt und
     entsaettigt wie echte Schneidematten. Schwarz ist der Grundzustand und
     wertgleich mit --df-schwarz. */
  --df-matte-schwarz:  #0C0E11;
  --df-matte-gruen:    #2E4A3C;
  --df-matte-blau:     #2B4257;
  --df-matte-rot:      #5C3230;
  --df-matte-lila:     #413859;
  --df-matte-gelb:     #C9B478;
  --df-matte-weiss:    #E4E2DC;

  /* Zwei Tinten. Welche gilt, entscheidet die relative Leuchtdichte der
     Matte, nicht der Farbton. */
  --df-riss-hell:      #E8EAED;
  --df-riss-dunkel:    #14171A;

  /* Verlaufsstufen des Metalls */
  --df-metall-tief:    #5A5D62;
  --df-metall-mittel:  #C7CAD0;
  --df-metall-glanz:   #FFFFFF;

  /* Lichter und Tiefen, nur als Transparenz ueber den Grundfarben */
  --df-licht-stark:    rgba(255, 255, 255, .22);
  --df-licht:          rgba(255, 255, 255, .09);
  --df-licht-fein:     rgba(255, 255, 255, .05);
  --df-tiefe:          rgba(0, 0, 0, .45);
  --df-schleier:       rgba(12, 14, 17, .96);

  --df-metall: linear-gradient(135deg,
    var(--df-metall-tief)   0%,
    var(--df-metall-mittel) 30%,
    var(--df-metall-glanz)  50%,
    var(--df-silber)        65%,
    var(--df-metall-tief)  100%);

  /* Feine Buerstung, keine Bilddatei */
  --df-buerste: repeating-linear-gradient(118deg,
    var(--df-licht-fein) 0 1px,
    transparent 1px 4px);

  /* Schrift: Anzeige kondensiert und kantig, Funktion ruhig */
  --df-anzeige: "SF Compact Display", "SF Compact", "Roboto Condensed",
                "Arial Narrow", "Franklin Gothic Medium", "Segoe UI", system-ui, sans-serif;

  /* Wortmarke: schwerste kondensierte Groteske, die ohne Ladevorgang
     bereitsteht. Impact liegt auf macOS und Windows, Haettenschweiler
     ist der Windows-Zwilling, Arial Narrow Bold der letzte Halt vor
     system-ui. Der Vergleich gegen Arial Black steht in
     entwurfsentscheidungen.md. */
  --df-anzeige-marke: Impact, Haettenschweiler, "Arial Narrow Bold",
                      "Franklin Gothic Heavy", system-ui, sans-serif;
  --df-funktion: system-ui, -apple-system, "Segoe UI", sans-serif;
  --df-technisch: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Groessenstufen der Schrift, Guide Abschnitt 2 */
  --df-t1: 11px;  /* Auszeichner */
  --df-t2: 13px;  /* Beschriftungen, kompakte Bedienelemente */
  --df-t3: 15px;  /* Bedienelemente, Listenzeilen */
  --df-t4: 17px;  /* Grundgroesse */
  --df-t5: 20px;  /* Titel */
  --df-t6: 28px;  /* Uebertragungscode */

  /* Laufweiten, Guide Abschnitt 2. Aus acht Werten sind vier geworden. */
  --df-lauf-marke:  -.012em;   /* nur die Wortmarke */
  --df-lauf-null:   0;         /* Fliesstext, Bedienelemente */
  --df-lauf-titel:  .06em;     /* Anzeige-Rolle ab Stufe 4 */
  --df-lauf-versal: .14em;     /* Versalien unter Stufe 3 */

  /* Raster: Vielfache von 4 */
  --df-r1: 4px;  --df-r2: 8px;  --df-r3: 12px; --df-r4: 16px;
  --df-r5: 24px; --df-r6: 32px; --df-r7: 48px;
  --df-eck-klein: 6px;
  --df-eck: 10px;
  --df-eck-gross: 14px;
  --df-eck-rund: 999px;        /* nur Pillen */

  /* Hoehen, Guide Abschnitt 4 */
  --df-h-bedien: 44px;         /* kleinste Antippflaeche */
  --df-h-bedien-innen: 40px;   /* nur innerhalb einer 44er Gruppe */
  --df-h-leiste: 56px;         /* eine Zeile: Bedienhoehe plus Luft */
  --df-b-aufklapp: 320px;
  --df-b-dialog: 520px;
  --df-h-kachel: 84px;         /* zwei Zeilen Titel und Untertitel */
  --df-h-buehne-min: 140px;    /* Lineale und ein Mass nebeneinander */
  --df-b-zeichen: 24px;        /* Werkzeugsymbol in Leisten, Guide Abschnitt 8 */
  --df-b-zeichen-gross: 28px;  /* Werkzeugsymbol in Kacheln */
  --df-b-punkt: 20px;          /* Farbpunkt der Mattenwahl */
  --df-b-marke: 8px;           /* Warnpunkt am Geraeteschalter */
  --df-segment-luft: 2px;      /* Luft zwischen Teilflaechen einer Gruppe */
  --df-b-streifen: 320px;      /* Balken im Warnband */
  --df-h-streifen: 3px;
  --df-b-stepper: 28px;        /* senkrechter Stepper am Zeigergeraet */
  --df-b-schritt: 32px;        /* Anzeige der Schrittweite */

  /* Bewegungsdauern, Guide Abschnitt 7 */
  --df-zeit-kurz: 80ms;
  --df-zeit: 180ms;
  --df-zeit-lang: 350ms;
  --df-zeit-glanz: 1200ms;     /* einmaliger Lauf ueber die Wortmarke */

  /* Regler. Der Griff wird aus diesen beiden Hoehen gerechnet, nicht aus
     einer festen Zahl: sonst wird er still falsch, sobald eine davon
     wechselt. */
  --df-h-schiene: 4px;
  --df-b-griff: 28px;

  /* Die Luft der Leiste faellt aus Hoehe minus Bedienhoehe, damit hier
     keine freie Zahl steht. Sie ergibt 6 Pixel und liegt damit bewusst
     neben dem Viererraster; begruendet in entwurfsentscheidungen.md. */
  --df-leiste-luft: calc((var(--df-h-leiste) - var(--df-h-bedien)) / 2);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

body {
  font-family: var(--df-funktion);
  background: var(--df-schwarz);
  color: var(--df-silber-hell);
  font-size: var(--df-t4);
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

/* Verlaufsdefinition fuer die Icons, darf nicht display:none sein.
   Kleine Flaechen brauchen mehr Licht als grosse: der Verlauf laeuft hier
   von Silber ueber das Glanzlicht in eine dunkle Kante, statt an beiden
   Enden dunkel zu beginnen. Sonst wirken Icons in 24 Pixel nur grau. */
.df-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
#dfMetall .s0 { stop-color: var(--df-silber); }
#dfMetall .s1 { stop-color: var(--df-metall-glanz); }
#dfMetall .s2 { stop-color: var(--df-silber-hell); }
#dfMetall .s3 { stop-color: var(--df-metall-mittel); }
#dfMetall .s4 { stop-color: var(--df-metall-tief); }

#anwendung {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding-top: env(safe-area-inset-top);
}

/* Die Leiste steht am oberen Rand und behaelt ihre volle Breite; nur ihr
   Inhalt rueckt aus den runden Ecken heraus. */
.leiste {
  padding-left: calc(var(--df-r2) + env(safe-area-inset-left));
  padding-right: calc(var(--df-r2) + env(safe-area-inset-right));
}

/* ---------- Bewegung ---------------------------------------------------- */

@keyframes df-auf { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Kein Fuellmodus "both": ein angehaltenes Aufblenden darf keine Flaeche
   dauerhaft unsichtbar lassen, am wenigsten die Messflaeche. */
.df-eintritt { animation: df-auf var(--df-zeit) ease-out; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001s !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001s !important;
  }
}

/* ---------- Wortmarke --------------------------------------------------- */

/* Wortmarke und Zusatz stehen auf einer gemeinsamen Grundlinie. Kein
   overflow: hidden mehr: die runden Versalien C und O ueberschreiten die
   Versalhoehe nach oben und die Grundlinie nach unten, ein knapper Rahmen
   schneidet sie ab. Die Breite haelt stattdessen die Einpassung im Skript. */
.marke {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: var(--df-r2) var(--df-r3);
  padding: var(--df-r5) var(--df-r4) var(--df-r4);
  flex: 0 0 auto;
  max-width: 100%;
}

/* Die Schriftgroesse des Blocks bestimmt die Wortmarke. Untergrenze: auf
   320 Pixel Breite bleibt die erste Kachel im Bild. */
.marke-block {
  display: flex;
  align-items: baseline;
  font-size: clamp(2rem, 15vw, 6.5rem);
  line-height: 1;
  flex: 0 0 auto;
}

/* Der Verlauf liegt auf der Schrift selbst. Ausnahme von der Regel
   "keine Verlaeufe auf Text unter 20 Pixel": hier steht die Schrift
   zwischen 30 und 108 Pixel.
   Zeilenhoehe 1 statt 0,78: bei einer engeren Zeile ragen die runden
   Versalien aus dem Zeilenkasten und werden von jedem Rahmen darueber
   beschnitten. */
.marke .schrift {
  font-family: var(--df-anzeige-marke);
  font-size: 1em;
  font-weight: 900;
  font-synthesis: none;          /* kein kuenstliches Fetten von Impact */
  line-height: 1;
  letter-spacing: var(--df-lauf-marke);   /* Buchstaben wachsen zur Masse zusammen */
  text-transform: uppercase;
  white-space: nowrap;
  display: block;
  position: relative;
  background: var(--df-metall);
  background-size: 260% 100%;
  background-position: 50% 50%;  /* Ruhelage: Glanzlicht mittig, Kanten dunkler */
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}

/* Einmaliger Lauf des Glanzlichts, endet genau in der Ruhelage */
@keyframes df-glanz {
  from { background-position: 112% 50%; }
  to   { background-position:  50% 50%; }
}

.marke .schrift.glanz { animation: df-glanz var(--df-zeit-glanz) cubic-bezier(.32, 0, .12, 1); }

@media (prefers-reduced-motion: reduce) {
  .marke .schrift.glanz { animation: none; }
}

/* Steht unmittelbar rechts neben der Wortmarke auf deren Grundlinie, nicht
   am rechten Rand. Auf schmalen Bildschirmen rutscht er darunter. */
.marke-zusatz {
  font-family: var(--df-funktion);
  font-size: var(--df-t2);
  font-weight: 400;
  letter-spacing: var(--df-lauf-versal);
  text-transform: uppercase;
  color: var(--df-silber-dunkel);
  white-space: nowrap;
  flex: 0 0 auto;
}

/* ---------- Schaltflaechen ---------------------------------------------- */

button {
  font: inherit;
  font-family: var(--df-funktion);
  color: var(--df-silber-hell);
  background: var(--df-grau);
  border: 1px solid var(--df-linie);
  border-radius: var(--df-eck);
  min-height: var(--df-h-bedien);
  padding: 0 var(--df-r4);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  box-shadow: inset 0 1px 0 var(--df-licht-fein);
  transition: background-position var(--df-zeit-lang) ease,
              background-color var(--df-zeit) ease,
              border-color var(--df-zeit) ease,
              transform var(--df-zeit-kurz) ease;
}

/* Ueberfahren nur bei echtem Zeiger. Auf dem iPhone bleibt der Zustand nach
   dem Antippen sonst stehen, bis woanders getippt wird, und markiert damit
   ein Element, das gar nicht mehr gemeint ist. */
@media (hover: hover) {
  button:hover { border-color: var(--df-silber-dunkel); }
}

button:active { transform: translateY(1px); }

button:focus-visible,
input:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--df-silber);
  outline-offset: 2px;
}

/* Primaer: polierte Metallflaeche, Glanzlicht wandert beim Beruehren */
button.haupt {
  background: var(--df-metall);
  background-size: 240% 100%;
  background-position: 18% 50%;
  border-color: var(--df-metall-tief);
  color: var(--df-schwarz);
  font-weight: 600;
  position: relative;
  overflow: hidden;
}

button.haupt::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--df-buerste);
  pointer-events: none;
}

/* Der wandernde Glanz haengt an zwei Ausloesern. Das Druecken bleibt auf
   allen Geraeten, nur das Ueberfahren wird auf Zeigergeraete beschraenkt. */
button.haupt:active { background-position: 78% 50%; }

@media (hover: hover) {
  button.haupt:hover { background-position: 78% 50%; }
}

button.leise {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  color: var(--df-silber);
  padding: 0 var(--df-r2);
}

@media (hover: hover) {
  button.leise:hover { border-color: var(--df-linie); }
}

button.klein { padding: 0 var(--df-r3); font-size: var(--df-t3); }

button[aria-pressed="true"] {
  background: var(--df-linie);
  border-color: var(--df-silber-dunkel);
  color: var(--df-silber-hell);
}

button:disabled { opacity: .45; cursor: default; transform: none; }

/* ---------- Flaechen ---------------------------------------------------- */

.blaettern {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 var(--df-r4) calc(var(--df-r6) + env(safe-area-inset-bottom));
}

.karte {
  background: var(--df-grau);
  border: 1px solid var(--df-linie);
  border-radius: var(--df-eck-gross);
  box-shadow: inset 0 1px 0 var(--df-licht-fein);
  padding: var(--df-r4);
  margin-bottom: var(--df-r3);
}

.karte h2, .abschnitt-titel {
  font-family: var(--df-anzeige);
  font-stretch: 87%;
  font-size: var(--df-t2);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: var(--df-lauf-versal);
  color: var(--df-text-sekundaer);
  margin: 0 0 var(--df-r3);
}

.trenner {
  display: flex;
  align-items: center;
  gap: var(--df-r3);
  margin: var(--df-r6) 0 var(--df-r4);
}

.trenner::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--df-linie);
}

.trenner .abschnitt-titel { margin: 0; }

.zeile { display: flex; align-items: center; gap: var(--df-r2); flex-wrap: wrap; }
.zeile + .zeile { margin-top: var(--df-r2); }

label.feld {
  display: block;
  font-size: var(--df-t2);
  letter-spacing: var(--df-lauf-null);
  color: var(--df-text-sekundaer);
  margin-bottom: var(--df-r1);
}

input[type="text"], select {
  font: inherit;
  font-family: var(--df-funktion);
  font-variant-numeric: tabular-nums;
  color: var(--df-silber-hell);
  background: var(--df-schwarz);
  border: 1px solid var(--df-linie);
  border-radius: var(--df-eck);
  min-height: var(--df-h-bedien);
  padding: 0 var(--df-r3);
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
}

select { padding-right: var(--df-r6); }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: var(--df-h-bedien);
  background: transparent;
  margin: 0;
}

input[type="range"]::-webkit-slider-runnable-track {
  height: var(--df-h-schiene);
  background: var(--df-schwarz);
  border: 1px solid var(--df-linie);
  border-radius: calc(var(--df-h-schiene) / 2);
}

/* Der Griff sitzt in der Mitte der Schiene. Gerechnet aus beiden Hoehen
   und dem einen Pixel Rand, nicht als feste Zahl: sonst waere er still
   verschoben, sobald eine der beiden Hoehen wechselt. */
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: var(--df-b-griff); height: var(--df-b-griff);
  margin-top: calc((var(--df-h-schiene) - var(--df-b-griff)) / 2 - 1px);
  border-radius: 50%;
  background: var(--df-metall);
  background-size: 200% 200%;
  border: 1px solid var(--df-metall-tief);
  box-shadow: 0 1px 2px var(--df-tiefe);
}

input[type="range"]::-moz-range-track {
  height: var(--df-h-schiene);
  background: var(--df-schwarz);
  border: 1px solid var(--df-linie);
  border-radius: calc(var(--df-h-schiene) / 2);
}

input[type="range"]::-moz-range-thumb {
  width: calc(var(--df-b-griff) - 2px); height: calc(var(--df-b-griff) - 2px);
  border-radius: 50%;
  background: var(--df-silber);
  border: 1px solid var(--df-metall-tief);
}

.wert { font-variant-numeric: tabular-nums; font-weight: 600; }

.hinweis {
  font-variant-numeric: tabular-nums;
  font-size: var(--df-t2);
  color: var(--df-text-sekundaer);
  margin-top: var(--df-r2);
}

/* Rueckmeldung wird gelesen, nicht ueberflogen: eine Stufe hoeher. */
.meldung {
  font-variant-numeric: tabular-nums;
  font-size: var(--df-t3);
  border-radius: var(--df-eck);
  padding: var(--df-r2) var(--df-r3);
  margin-top: var(--df-r2);
  display: none;
  border: 1px solid var(--df-linie);
  background: var(--df-schwarz);
}

.meldung.zeigen { display: block; }
.meldung.fehler { border-color: var(--df-silber-dunkel); color: var(--df-silber-hell); }
.meldung.gut { border-color: var(--df-silber); color: var(--df-silber-hell); }

.merksatz {
  border-left: 2px solid var(--df-silber-dunkel);
  background: var(--df-grau);
  color: var(--df-text-sekundaer);
  padding: var(--df-r3) var(--df-r4);
  border-radius: 0 var(--df-eck) var(--df-eck) 0;
  font-size: var(--df-t3);
}

.code-anzeige {
  font-variant-numeric: tabular-nums;
  font-family: var(--df-technisch);
  font-size: var(--df-t6);
  letter-spacing: var(--df-lauf-versal);
  background: var(--df-schwarz);
  border: 1px solid var(--df-linie);
  border-radius: var(--df-eck);
  padding: var(--df-r3) var(--df-r4);
  text-align: center;
  color: var(--df-silber-hell);
  user-select: all;
  -webkit-user-select: all;
}

.tabelle { width: 100%; font-size: var(--df-t2); border-collapse: collapse;
  font-variant-numeric: tabular-nums; }
.tabelle td { padding: var(--df-r1) 0; vertical-align: top; }
.tabelle td:first-child { color: var(--df-text-sekundaer); padding-right: var(--df-r4); white-space: nowrap; width: 1%; }
.tabelle td:last-child { font-variant-numeric: tabular-nums; }

/* ---------- Kachelraster ------------------------------------------------ */

.kacheln {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--df-r3);
}

@media (min-width: 560px) { .kacheln { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .kacheln { grid-template-columns: repeat(3, 1fr); } }

.kachel {
  display: flex;
  align-items: flex-start;
  gap: var(--df-r3);
  width: 100%;
  text-align: left;
  background: var(--df-grau);
  border: 1px solid var(--df-linie);
  border-radius: var(--df-eck-gross);
  box-shadow: inset 0 1px 0 var(--df-licht-fein);
  padding: var(--df-r4);
  min-height: var(--df-h-kachel);
}

.kachel .zeichen { width: var(--df-b-zeichen-gross); height: var(--df-b-zeichen-gross);
  flex: 0 0 auto; margin-top: 2px; }
.kachel .zeichen svg { width: 100%; height: 100%; display: block; }

.kachel .titel {
  font-family: var(--df-anzeige);
  font-stretch: 87%;
  font-size: var(--df-t4);
  font-weight: 700;
  letter-spacing: var(--df-lauf-titel);
  color: var(--df-silber-hell);
}

.kachel .unter { font-size: var(--df-t2); color: var(--df-text-sekundaer); margin-top: 2px; }

.kachel:not(.geplant) { box-shadow: inset 0 1px 0 var(--df-licht); }
.kachel.geplant { cursor: default; }
.kachel.geplant .titel { color: var(--df-silber-dunkel); }
.kachel.geplant .unter { color: var(--df-silber-dunkel); }
.kachel.geplant svg [fill]:not([fill="none"]) { fill: var(--df-silber-dunkel); }
.kachel.geplant svg [stroke]:not([stroke="none"]) { stroke: var(--df-silber-dunkel); }

/* Eine geplante Kachel nimmt das Ueberfahren nicht an. Die Regel steht im
   selben Block wie button:hover, sonst hebt sie eine Regel auf, die auf
   Tastgeraeten gar nicht erst gilt. */
@media (hover: hover) {
  .kachel.geplant:hover { border-color: var(--df-linie); }
}

.marke-vor {
  display: inline-block;
  font-size: var(--df-t1);
  letter-spacing: var(--df-lauf-versal);
  text-transform: uppercase;
  color: var(--df-silber-dunkel);
  border: 1px solid var(--df-linie);
  border-radius: var(--df-eck-rund);
  padding: 1px var(--df-r2);
  margin-top: var(--df-r2);
}

/* ---------- Zeichenflaeche ---------------------------------------------- */

/* Die Lineale sitzen an den Kanten der Zeichenflaeche. Damit sie nicht
   unter Dynamic Island, abgerundeten Ecken oder dem Home-Indikator
   verschwinden, rueckt die Flaeche um die sicheren Bereiche ein.
   Der Nullpunkt bleibt davon unberuehrt: Lineal und Raster rechnen beide
   ab der linken oberen Ecke dieser Flaeche und ruecken gemeinsam mit. */
.buehne {
  position: relative;
  flex: 1 1 auto;
  min-height: var(--df-h-buehne-min);
  background: var(--df-matte-schwarz);
  overflow: hidden;
  margin-left: env(safe-area-inset-left);
  margin-right: env(safe-area-inset-right);
  margin-bottom: env(safe-area-inset-bottom);
  /* Kein Aufziehen mit zwei Fingern und kein Doppeltipp-Zoom: beides
     verfaelscht jede Anzeige. Die Zoomueberwachung bleibt als
     Absicherung daneben bestehen. */
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

/* Ohne Einblenden. Auf der Messflaeche darf kein Einzelbild teildeckend
   sein: eine halb sichtbare Linie ist eine falsch abgelesene Linie. */
.buehne canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

/* Bedienelemente ueber der Flaeche bleiben bedienbar. */
.buehne .ueberlagerung, .buehne .warnband { touch-action: auto; }

/* Sobald die Zoomueberwachung anschlaegt, wird die Sperre aufgehoben: die
   Warnung verlangt, die Ansicht mit zwei Fingern zurueckzuziehen, und genau
   diese Geste haette touch-action: none unterbunden. Eine Anwendung darf
   nie in einen Zustand geraten, aus dem es keinen Weg heraus gibt. */
.buehne.zoomoffen { touch-action: pinch-zoom; }

.warnband {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--df-r3);
  text-align: center;
  padding: var(--df-r5);
  background: var(--df-matte-schwarz);   /* deckend, im Skript auf die Matte gesetzt */
  z-index: 5;
}

.warnband.zeigen { display: flex; }

.warnband strong {
  font-family: var(--df-anzeige);
  font-stretch: 87%;
  font-size: var(--df-t5);
  letter-spacing: var(--df-lauf-titel);
  text-transform: uppercase;
  color: var(--df-warnung);
}

.warnband.sachlich strong { color: var(--df-silber); }
.warnband span { color: var(--df-silber-hell); font-size: var(--df-t3); max-width: 34em; }

.warnband .streifen {
  width: 100%;
  max-width: var(--df-b-streifen);
  height: var(--df-h-streifen);
  background: var(--df-warnung);
}

.warnband.sachlich .streifen { background: var(--df-silber-dunkel); }
.warnband .hinweis { max-width: 34em; margin-top: 0; }

/* ---------- Bedienleiste ------------------------------------------------ */

/* Eine einzige Zeile fuer Navigation und Bedienung. Ihre Hoehe steht in
   --df-h-leiste; die Luft faellt daraus ab, damit hier keine freie Zahl
   steht. Auf schmalen Bildschirmen bricht sie auf hoechstens zwei Zeilen um. */
.leiste {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--df-r2);
  min-height: var(--df-h-leiste);
  padding: var(--df-leiste-luft) var(--df-r2);
  background: var(--df-grau);
  border-bottom: 1px solid var(--df-linie);
  box-shadow: inset 0 1px 0 var(--df-licht-fein);
}

.leiste > * { flex: 0 0 auto; }

.leiste .haupt { font-size: var(--df-t3); }

/* Zurueck, Werkzeugzeichen und Werkzeugname stehen am Anfang derselben
   Zeile; eine zweite Leiste darueber gibt es nicht mehr. */
.leiste-zurueck {
  min-width: var(--df-h-bedien);
  padding: 0;
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  color: var(--df-silber);
}

.leiste-zeichen {
  width: var(--df-b-zeichen);
  height: var(--df-b-zeichen);
  flex: 0 0 auto;
  margin-left: var(--df-r1);
}

.leiste-zeichen svg { width: 100%; height: 100%; display: block; }

.geometriename {
  display: none;
  font-family: var(--df-anzeige);
  font-stretch: 87%;
  font-size: var(--df-t3);
  font-weight: 700;
  font-synthesis: none;
  letter-spacing: var(--df-lauf-titel);
  color: var(--df-silber-hell);
  white-space: nowrap;
  margin-right: var(--df-r1);
}

.werkzeugname {
  font-family: var(--df-anzeige);
  font-stretch: 87%;
  font-size: var(--df-t5);
  font-weight: 700;
  font-synthesis: none;
  letter-spacing: var(--df-lauf-titel);
  color: var(--df-silber-hell);
  white-space: nowrap;
  margin-right: var(--df-r2);
}

/* Auswahlfeld mit eigenem Zeichen statt des Systempfeils. Der Pfeil ist
   dasselbe SVG wie ueberall sonst, nicht aus Verlaeufen gebaut. */
.auswahlfeld { position: relative; display: flex; align-items: center; }

.auswahlfeld select {
  min-height: var(--df-h-bedien);
  width: auto;
  font-size: var(--df-t3);
  padding: 0 var(--df-r6) 0 var(--df-r3);
}

.auswahlfeld .pfeil {
  position: absolute;
  right: var(--df-r3);
  pointer-events: none;
  display: flex;
  color: var(--df-silber);
}

/* Aussen 44 Pixel hoch wie jede andere Schaltflaeche: ein Pixel Luft,
   ein Pixel Rand, innen 40 Pixel. */
.wertgruppe {
  display: flex;
  align-items: center;
  gap: var(--df-segment-luft);
  background: var(--df-schwarz);
  border: 1px solid var(--df-linie);
  border-radius: var(--df-eck);
  padding: 1px;
}

.wertgruppe .etikett-kurz { display: none; }

.wertgruppe .etikett, .wertgruppe .etikett-kurz {
  font-size: var(--df-t2);
  letter-spacing: var(--df-lauf-null);
  color: var(--df-text-sekundaer);
  padding: 0 var(--df-r1) 0 var(--df-r2);
  white-space: nowrap;
}

/* Die Leiste bleibt auf den Stufen 13 und 15 und folgt der Grundgroesse
   nicht nach oben, damit sie nicht hoeher wird. */
.wertgruppe input {
  font-size: var(--df-t3);
  min-height: var(--df-h-bedien-innen);
  width: 5.6em;
  border: none;
  background: transparent;
  text-align: right;
  padding: 0 var(--df-r1);
  font-variant-numeric: tabular-nums;
}

.wertgruppe .einheit-nach {
  font-size: var(--df-t2);
  color: var(--df-text-sekundaer);
  padding-right: var(--df-r1);
}

/* Innerhalb einer 44er Gruppe: Hoehe 40 nach der begruendeten Ausnahme,
   Breite aber volle 44, denn seitlich grenzt keine Gruppenkante an.
   Der Radius folgt dem Innenabstand von einem Pixel. */
.wertgruppe button {
  min-height: var(--df-h-bedien-innen);
  min-width: var(--df-h-bedien);
  padding: 0 var(--df-r1);
  border-radius: calc(var(--df-eck) - 1px);
  background: var(--df-grau);
  box-shadow: none;
  color: var(--df-silber);
}

/* Gemessen: das Minuszeichen sass 14 Pixel zu weit links, der Zurueck-Pfeil
   5,8 Pixel zu tief. Ursachen waren zwei verschiedene:
   text-align: center wirkt nur auf Zeileninhalt, nicht auf ein Kind mit
   display: block, und ein Zeichen mit display: inline sitzt auf der
   Grundlinie und laesst darunter Platz fuer Unterlaengen.
   Jede Flaeche, die nur ein Zeichen traegt, ist deshalb ein Flexkasten:
   das zentriert in beiden Richtungen und haengt an keiner Schrift. */
.leiste-zurueck,
.wertgruppe button,
.chip .pfeil,
.chip .mehr,
.auswahlfeld .pfeil,
.wahl .haken,
.farbfeld .punkt {
  align-items: center;
  justify-content: center;
}

.leiste-zurueck, .wertgruppe button { display: flex; }

.wertgruppe button svg, .leiste-zurueck svg { display: block; }

.wertgruppe button.schritt {
  min-width: var(--df-b-schritt);
  font-size: var(--df-t2);
  font-variant-numeric: tabular-nums;
  color: var(--df-text-sekundaer);
}

/* Stepper. Am Zeigergeraet gestapelt wie der Stepper von macOS, am
   Tastgeraet waagerecht mit voller Antippflaeche. Beide Faelle stehen in
   Abschnitt 4 des Guides. */
.stepper { display: flex; gap: 1px; }
.segmente .text { pointer-events: none; }
.stepper .pfeilzeichen, .stepper .rechenzeichen { display: none; }

@media (pointer: fine) {
  .stepper {
    flex-direction: column;
    width: var(--df-b-stepper);
    height: var(--df-h-bedien-innen);
  }
  .stepper button {
    min-width: 0;
    min-height: 0;
    width: 100%;
    flex: 1 1 0;
    padding: 0;
    border-radius: calc(var(--df-eck) - 1px);
  }
  .stepper .auf { border-bottom-left-radius: 2px; border-bottom-right-radius: 2px; }
  .stepper .ab  { border-top-left-radius: 2px;    border-top-right-radius: 2px; }
  .stepper .pfeilzeichen { display: flex; }
  .wertgruppe button.schritt { min-width: 0; width: var(--df-b-schritt); }
}

@media (pointer: coarse) {
  /* Begruendete Ausnahme von der Groessenleiter: iOS Safari zoomt die Seite
     heran, sobald ein Eingabefeld mit weniger als 16 Pixel den Fokus
     bekommt. Der Zoom bricht die Masshaltigkeit. Stufe t4 ist die kleinste
     Stufe darueber. Gilt nur fuer Felder, nur bei Tastgeraeten. */
  input, select, textarea,
  .auswahlfeld select, .leiste select, .wertgruppe input { font-size: var(--df-t4); }

  .stepper { flex-direction: row; gap: var(--df-segment-luft); }
  .stepper .ab { order: -1; }
  .stepper .rechenzeichen { display: flex; }
}

/* Umschalter. Der markierte Bereich ist ein eigenes Element und folgt dem
   Zeiger, statt erst beim Loslassen zu springen. */
.segmente { position: relative; }

/* Breite und Weg der Marke fallen aus der Anzahl der Segmente und der
   Luft dazwischen; --n und --i setzt das Skript. Vorher war die Marke um
   den Innenabstand zu breit und deckte das zweite Segment nicht genau. */
.segmente .marke-segment {
  position: absolute;
  top: 1px;
  left: 1px;
  width: calc((100% - 2px - (var(--n) - 1) * var(--df-segment-luft)) / var(--n));
  transform: translateX(calc(var(--i) * (100% + var(--df-segment-luft))));
  height: calc(100% - 2px);
  background: var(--df-metall);
  background-size: 240% 100%;
  background-position: 18% 50%;
  border: 1px solid var(--df-metall-tief);
  border-radius: calc(var(--df-eck) - 1px);
  transition: transform var(--df-zeit) ease;
  pointer-events: none;
  z-index: 0;
}

.segmente.zieht .marke-segment { transition: none; }
.segmente button { position: relative; z-index: 1; touch-action: none; }

/* Raster statt Flexverteilung: nur so sind alle Segmente einer Gruppe
   gleich breit, und die Breite richtet sich nach der laengsten
   Beschriftung. Bei flex: 1 1 0 blieb die Breite an der Textbreite
   haengen, sobald der Inhalt die Verteilung ueberstimmte. */
.segmente {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: var(--df-segment-luft);
  background: var(--df-schwarz);
  border: 1px solid var(--df-linie);
  border-radius: var(--df-eck);
  padding: 1px;
}

.segmente button {
  font-variant-numeric: tabular-nums;   /* Schrittweiten 0,1 / 1 / 10 */
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  background: transparent;
  box-shadow: none;
  border-radius: calc(var(--df-eck) - 1px);
  min-height: var(--df-h-bedien-innen);
  padding: 0 var(--df-r2);
  font-size: var(--df-t2);
  color: var(--df-text-sekundaer);
  white-space: nowrap;
}

.segmente button[aria-pressed="true"] {
  color: var(--df-schwarz);
  font-weight: 600;
}

@media (hover: hover) {
  .segmente:not(.zieht):hover .marke-segment { background-position: 78% 50%; }
}

/* Geraet, Code und Kalibrieren stehen rechts und sind abgesetzt */
/* Drei Bereiche in der Leiste: Bedienung, Darstellung, Geraet. Genau zwei
   Trennlinien, je eine links vor dem zweiten und dritten Bereich. Als
   eigenes Element statt als Rand: nur so haben beide dieselbe Hoehe und
   sitzen mittig zwischen den angrenzenden Gruppen. */
.leiste-trenner {
  position: relative;
  padding-left: var(--df-r2);
}

.leiste-trenner::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 1px;
  height: var(--df-h-bedien);
  background: var(--df-linie);
}

.leiste-rechts {
  display: flex;
  align-items: center;
  gap: var(--df-r2);
}

.chip {
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  gap: var(--df-r2);
  min-height: var(--df-h-bedien);
  background: var(--df-schwarz);
  border: 1px solid var(--df-linie);
  border-radius: var(--df-eck);
  padding: 0 var(--df-r3);
  font-size: var(--df-t2);
  color: var(--df-silber);
  white-space: nowrap;
  box-shadow: none;
}

.chip .name { max-width: 15ch; overflow: hidden; text-overflow: ellipsis; }
.chip .code { font-family: var(--df-technisch); letter-spacing: var(--df-lauf-titel); }
.chip .pfeil { color: var(--df-silber-dunkel); display: flex; }
.chip .mehr { display: none; color: var(--df-silber); }

/* Mattenfarbe. Abgesetzt wie der Bereich rechts, mit eigener Trennlinie. */
.leiste-matte {
  display: flex;
  align-items: center;
  margin-left: auto;
}

/* Die Gruppe rechts wird nach rechts geschoben. Steht die Mattenwahl davor,
   uebernimmt diese den Schub.
   Nicht :first-of-type verwenden: das meint den Elementtyp, nicht die
   Klasse, und traf hier nie zu. */
.leiste > .leiste-rechts { margin-left: auto; }
.leiste-matte ~ .leiste-rechts { margin-left: 0; }

.farbfeld { position: relative; }

.farbfeld .knopf {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: var(--df-h-bedien);
  padding: 0;
  background: var(--df-schwarz);
}

.farbfeld .punkt {
  display: flex;
  width: var(--df-b-punkt);
  height: var(--df-b-punkt);
  border-radius: 50%;
  border: 1px solid var(--df-linie);
}

.farbliste { display: flex; flex-direction: column; gap: 1px; }
.farbliste .punkt {
  width: calc(var(--df-b-punkt) - 2px);
  height: calc(var(--df-b-punkt) - 2px);
  border-radius: 50%;
  border: 1px solid var(--df-linie);
  flex: 0 0 auto;
}

/* ---------- Aufklappfenster der Geraeteanzeige -------------------------- */

.geraet-feld { position: relative; }

.aufklapp {
  position: absolute;
  top: calc(100% + var(--df-r2));
  right: 0;
  z-index: 30;
  width: var(--df-b-aufklapp);
  max-width: calc(100vw - 2 * var(--df-r3));
  max-height: calc(100vh - var(--df-h-leiste) - var(--df-r6));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--df-grau);
  border: 1px solid var(--df-linie);
  border-radius: var(--df-eck-gross);
  box-shadow: inset 0 1px 0 var(--df-licht), 0 12px 40px var(--df-tiefe);
  padding: var(--df-r4);
  display: none;
  text-align: left;
  white-space: normal;
}

.aufklapp.offen { display: block; }
.aufklapp h3 {
  font-family: var(--df-anzeige);
  font-stretch: 87%;
  font-size: var(--df-t2);
  letter-spacing: var(--df-lauf-versal);
  text-transform: uppercase;
  color: var(--df-text-sekundaer);
  margin: 0 0 var(--df-r2);
}
.aufklapp .code-anzeige { font-size: var(--df-t5); padding: var(--df-r2); }

/* Geraeteliste im Aufklappfenster */
.wahlliste { display: flex; flex-direction: column; gap: 1px; }

/* Jede Zeile, die einen Wert tragen kann, bekommt gleiche Ziffernbreiten:
   "Benutzerdefiniert, 216,1 mm" springt sonst beim Nachjustieren. */
.wahl {
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  gap: var(--df-r2);
  width: 100%;
  min-height: var(--df-h-bedien);
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  box-shadow: none;
  border-radius: var(--df-eck-klein);
  padding: 0 var(--df-r2);
  font-size: var(--df-t3);
  color: var(--df-silber-hell);
}

@media (hover: hover) {
  .wahl:hover { background: var(--df-schwarz); border-color: var(--df-linie); }
}

.wahl[aria-current="true"] { background: var(--df-schwarz); border-color: var(--df-silber-dunkel); }
.wahl .haken { width: 14px; flex: 0 0 auto; color: var(--df-silber); display: flex; }
.wahl .haken svg { display: block; }
.wahl .beschriftung { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wahl .zusatz { flex: 0 0 auto; font-size: var(--df-t1); letter-spacing: var(--df-lauf-versal); text-transform: uppercase; color: var(--df-text-sekundaer); }

.wahl-trenner { height: 1px; background: var(--df-linie); margin: var(--df-r2) 0; }

/* Der Punkt sitzt in der Mitte der ersten Zeile. Gerechnet aus Zeilenhoehe
   und Punktgroesse, damit er beim Wechsel einer Stufe nicht verrutscht. */
/* Der Punkt ist die einzige Stelle ausserhalb der Zoom-Warnung, an der die
   Warnfarbe erscheint; sie ist hier ausdruecklich verlangt. */
.warnpunkt {
  width: var(--df-b-marke);
  height: var(--df-b-marke);
  border-radius: 50%;
  background: var(--df-warnung);
  flex: 0 0 auto;
  display: none;
}

.warnpunkt.zeigen { display: block; }

.warnzeile {
  display: flex;
  align-items: flex-start;
  gap: var(--df-r2);
  font-size: var(--df-t2);
  line-height: 1.45;
  margin-top: var(--df-r2);
  font-variant-numeric: tabular-nums;
}

.warnzeile .warnpunkt { display: block;
  margin-top: calc((1.45em - var(--df-b-marke)) / 2); }

/* ---------- Ueberlagerungen auf der Zeichenflaeche ---------------------- */

.ueberlagerung {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: var(--df-r2);
  background: var(--df-grau);
  border: 1px solid var(--df-linie);
  /* Schwebende Flaeche, also die groessere Stufe. Die enthaltenen
     Schaltflaechen bleiben auf --df-eck und liegen damit eine Stufe
     darunter; zwei verschachtelte Elemente tragen nie denselben Radius. */
  border-radius: var(--df-eck-gross);
  box-shadow: 0 8px 24px var(--df-tiefe);
  padding: var(--df-r2) var(--df-r3);
  font-size: var(--df-t3);
  max-width: calc(100% - 2 * var(--df-r6));
}

.hinweisleiste { bottom: var(--df-r6); display: none; }
.hinweisleiste.zeigen { display: flex; }
.hinweisleiste button { min-height: var(--df-h-bedien); font-size: var(--df-t2); padding: 0 var(--df-r3); }

.kalibrierleiste {
  bottom: var(--df-r6);
  width: min(560px, calc(100% - 2 * var(--df-r6)));
  flex-direction: column;
  align-items: stretch;
}

/* Frei stehende Schaltflaechen, also volle 44 Pixel; die Ausnahme fuer
   Gruppen gilt hier nicht. */
.kalibrierleiste input[type="range"] { width: 100%; height: var(--df-h-bedien-innen); }
.kalibrierleiste .zeile { justify-content: space-between; }
.kalibrierleiste button { min-height: var(--df-h-bedien); }

.meldeband {
  top: var(--df-r6);
  display: none;
  font-variant-numeric: tabular-nums;
}
.meldeband.zeigen { display: flex; }

/* Schmale Bildschirme: Geraet, Uebertragungscode und Kalibrieren stehen
   hinter einem Ueberlaufknopf, der Werkzeugname entfaellt, die
   Beschriftungen der Wertfelder wandern in den Platzhaltertext.
   Sichtbar bleiben Zurueck, Zeichen, Geometrie, Wert und Einheit. */
@media (max-width: 760px) {
  /* Eine einzige Zeile. In der Leiste bleiben Zurueck, Werkzeugzeichen,
     Geometriename, Wertfeld und der Ueberlaufknopf. Alles andere steht im
     Ueberlaufmenue: Schrittsteuerung, Ausrichtung, Einheit, Matte, Geraet,
     Uebertragungscode und Kalibrieren.
     Kein Umbruch: der Ueberlaufknopf sitzt immer am Ende derselben Zeile,
     damit er blind treffbar bleibt. Was links davon steht, schrumpft. */
  .leiste { flex-wrap: nowrap; }
  .leiste-code, .leiste-kalibrieren, .werkzeugname, .leiste-matte,
  .leiste > .segmente:not(.segmente-referenz), .leiste .auswahlfeld,
  .wertgruppe .stepper { display: none; }

  /* Der Zugang zu den weiteren Einstellungen behaelt seine Groesse und
     bleibt rechtsbuendig, auch wenn die Mattenwahl davor ausgeblendet ist. */
  .leiste-rechts { flex: 0 0 auto; }
  /* Dieselbe Genauigkeit wie die Regel, die den Schub auf dem Rechner an
     die Mattenwahl abgibt: sonst gewinnt jene, und der Knopf steht mitten
     in der Leiste. */
  .leiste-matte ~ .leiste-rechts { margin-left: auto; }
  .leiste-rechts .chip { flex: 0 0 auto; }

  /* Alles davor gibt bei Platzmangel nach. */
  /* Schrumpfen ja, wachsen nein: ein Wertfeld ueber die halbe Leiste zu
     ziehen, weil Platz frei ist, hilft niemandem. */
  .leiste > .wertgruppe { flex: 0 1 auto; min-width: 0; }
  .geometriename {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Im Kalibriermodus bleibt die Referenzauswahl in der Leiste; ihre
     Beschriftung entfaellt, die Segmente sagen es selbst. */
  .kalibrier-etikett { display: none; }
  .geometriename { display: block; }
  .chip .name, .chip .pfeil { display: none; }
  .chip .mehr { display: flex; }
  /* Der Ueberlaufknopf traegt nur ein Zeichen; ohne Mindestbreite bliebe er
     bei 40 Pixeln und damit unter der Antippflaeche. */
  .chip { padding: 0 var(--df-r2); gap: var(--df-r1); min-width: var(--df-h-bedien); }
  /* Die Trennlinie vor dem Ueberlaufknopf bleibt: sie setzt den Zugang zu
     den weiteren Einstellungen ab, genau wie auf dem Rechner die
     Geraetegruppe. */

  /* Zwei Zeilen zu je 44 Pixeln, ein Zwischenraum und zweimal Luft
     ergeben genau 100 Pixel. Mehr darf die Leiste nicht werden. */
  .leiste { gap: var(--df-r1); padding: var(--df-r1) var(--df-r2); }
  .auswahlfeld select { padding: 0 var(--df-r5) 0 var(--df-r2); }
  .auswahlfeld .pfeil { right: var(--df-r2); }
  /* Die lange Beschriftung weicht dem Platzhalter. Wo zwei Wertfelder
     nebeneinander stehen, bleibt ein Buchstabe: ein Platzhalter ist nur im
     leeren Feld sichtbar, und zwei gefuellte Felder ohne Marke waeren nicht
     auseinanderzuhalten. */
  .wertgruppe .etikett { display: none; }
  .wertgruppe.mehrfach .etikett-kurz { display: inline; padding: 0 0 0 var(--df-r2); }
  /* Das Einheitenkuerzel entfaellt hier. Die Einheit steht in der Ecke der
     Lineale und an der Bemassung der Geometrie; verwechseln laesst sie sich
     also nicht. Auf dem Rechner bleibt das Kuerzel, dort ist der Platz da
     und der Umschalter steht daneben. */
  .wertgruppe .einheit-nach { display: none; }
  .wertgruppe input { width: 3.4em; min-width: 2.6em; }
  /* Das Einheitenkuerzel steht als Umschalter in derselben Zeile, der
     Schrittweitenknopf im Ueberlaufmenue. Beides zusammen spart die dritte
     Zeile, ohne eine Antippflaeche unter 44 Pixel zu druecken. */
  .wertgruppe button.schritt { display: none; }

  /* Am Ausloeser verankert haengt das Fenster links aus dem Bild, sobald es
     breiter ist als der Platz rechts davon. Auf schmalen Bildschirmen wird

@media (min-width: 761px) {

<svg class="df-defs" aria-hidden="true" focusable="false">

<div id="anwendung"></div>

<script>
"use strict";

/* ==========================================================================
   Dietrich - Werkzeugkasten fuer ingenieurtechnische Alltagsaufgaben
   Aufbau:
     1. Hilfsfunktionen (Zahlen, Speicher, DOM, Farben)
     2. Geraetetabelle und Uebertragungscode
     3. Geraetemodul (Erkennung, Profil, Feinjustage, pxProMm)
     4. Zoom-Ueberwachung
     5. Icons und Werkzeug-Registry
     6. Rahmenanwendung (Startseite, Werkzeug, Werkzeugeinstellung, Kalibrierung)
     7. Zeichenhilfen
     8. Werkzeug "Massstab 1:1"
   ========================================================================== */

/* ---------- 1. Hilfsfunktionen ------------------------------------------ */

var HINWEISTEXT =
  'Die Darstellung erreicht eine Genauigkeit von etwa 0,2 bis 0,5 Millimetern. ' +
  'Sie dient der Größenabschätzung und ersetzt kein Messmittel. ' +
  'Für maßhaltige Prüfungen ist ein geeignetes Messgerät zu verwenden.';

/* Eingaben mit Komma und mit Punkt annehmen. */
function zahlLesen(text) {
  if (typeof text !== 'string') text = String(text == null ? '' : text);
  var bereinigt = text.trim().replace(/\s/g, '').replace(',', '.');
  if (bereinigt === '') return null;
  if (!/^-?\d*\.?\d*$/.test(bereinigt)) return null;
  var zahl = parseFloat(bereinigt);
  return isFinite(zahl) ? zahl : null;
}

/* Ausgaben immer mit Komma. */
function zahlSchreiben(zahl, stellen) {
  if (stellen == null) stellen = 1;
  if (zahl == null || !isFinite(zahl)) return '–';
  return zahl.toFixed(stellen).replace('.', ',');
}

var Speicher = {
  praefix: 'dietrich.',
  verfuegbar: false,
  pruefen: function () {
    try {
      window.localStorage.setItem(this.praefix + 'probe', '1');
      window.localStorage.removeItem(this.praefix + 'probe');
      this.verfuegbar = true;
    } catch (fehler) {
      this.verfuegbar = false;
    }
    return this.verfuegbar;
  },
  lesen: function (schluessel, standard) {
    try {
      var roh = window.localStorage.getItem(this.praefix + schluessel);
      if (roh === null) return standard;
      return JSON.parse(roh);
    } catch (fehler) {
      return standard;
    }
  },
  schreiben: function (schluessel, wert) {
    try {
      window.localStorage.setItem(this.praefix + schluessel, JSON.stringify(wert));
      return true;
    } catch (fehler) {
      return false;
    }
  },
  loeschen: function (schluessel) {
    try {
      window.localStorage.removeItem(this.praefix + schluessel);
      return true;
    } catch (fehler) {
      return false;
    }
  }
};
Speicher.pruefen();

/* Farbwerte kommen ausschliesslich aus den CSS-Variablen. */
/* ---------- Mattenfarben ------------------------------------------------ */

/* Die Zeichenflaeche liegt auf einer Matte. Aus ihrer Farbe faellt die
   Tinte und daraus die Leiter der sechs Zeichenstufen; siehe Abschnitt 12
   des Design Guides. Gerechnet wird hier im Skript und nicht mit CSS
   color-mix(): die Anwendung liegt in einer Datei und laeuft ueber file://,
   sie darf nicht davon abhaengen, welche Farbfunktionen ein Browser kennt.
   Das Ergebnis ist eine volldeckende Farbe, keine Teildeckkraft. */
var MATTEN = [
  { id: 'schwarz', name: 'Schwarz', token: '--df-matte-schwarz' },
  { id: 'gruen',   name: 'Grün',    token: '--df-matte-gruen' },
  { id: 'blau',    name: 'Blau',    token: '--df-matte-blau' },
  { id: 'rot',     name: 'Rot',     token: '--df-matte-rot' },
  { id: 'lila',    name: 'Lila',    token: '--df-matte-lila' },
  { id: 'gelb',    name: 'Gelb',    token: '--df-matte-gelb' },
  { id: 'weiss',   name: 'Weiß',    token: '--df-matte-weiss' }
];

/* Anteil der Tinte je Zeichenstufe, Guide Abschnitt 12 */
var RISS_ANTEILE = [1, 0.86, 0.60, 0.36, 0.21, 0.12];

function kanaeleLesen(wert) {
  var t = String(wert).trim();
  var m = t.match(/^#([0-9a-fA-F]{6})$/);
  if (m) {
    return [parseInt(m[1].slice(0, 2), 16),
            parseInt(m[1].slice(2, 4), 16),
            parseInt(m[1].slice(4, 6), 16)];
  }
  m = t.match(/^#([0-9a-fA-F]{3})$/);
  if (m) {
    return [parseInt(m[1][0] + m[1][0], 16),
            parseInt(m[1][1] + m[1][1], 16),
            parseInt(m[1][2] + m[1][2], 16)];
  }
  m = t.match(/rgba?\(([^)]+)\)/);
  if (m) {
    var teile = m[1].split(',');
    return [parseInt(teile[0], 10) || 0, parseInt(teile[1], 10) || 0, parseInt(teile[2], 10) || 0];
  }
  return [0, 0, 0];
}

function kanaeleSchreiben(k) {
  function zwei(v) {
    var t = Math.max(0, Math.min(255, Math.round(v))).toString(16);
    return t.length < 2 ? '0' + t : t;
  }
  return '#' + zwei(k[0]) + zwei(k[1]) + zwei(k[2]);
}

/* Relative Leuchtdichte nach WCAG */
function leuchtdichte(kanaele) {
  var g = kanaele.map(function (v) {
    var c = v / 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * g[0] + 0.7152 * g[1] + 0.0722 * g[2];
}

function kontrast(a, b) {
  var la = leuchtdichte(kanaeleLesen(a)), lb = leuchtdichte(kanaeleLesen(b));
  var hoch = Math.max(la, lb), tief = Math.min(la, lb);
  return (hoch + 0.05) / (tief + 0.05);
}

var Matte = {
  id: 'schwarz',
  leiter: null,

  eintrag: function (id) {
    for (var i = 0; i < MATTEN.length; i++) if (MATTEN[i].id === (id || this.id)) return MATTEN[i];
    return MATTEN[0];
  },

  starten: function () {
    var gemerkt = Speicher.lesen('mattenfarbe', null);
    if (gemerkt && this.eintrag(gemerkt).id === gemerkt) this.id = gemerkt;
    this.leiter = null;
  },

  waehlen: function (id) {
    if (this.eintrag(id).id !== id) return;
    this.id = id;
    this.leiter = null;
    Speicher.schreiben('mattenfarbe', id);
    Aenderung.melden('matte');
  },

  grund: function () { return Farbe.lies(this.eintrag().token); },

  /* Helle Matten tragen dunkle Tinte. Entschieden wird ueber die
     Leuchtdichte, nicht ueber den Farbton. */
  tinte: function () {
    var hell = leuchtdichte(kanaeleLesen(this.grund())) >= 0.30;
    return Farbe.lies(hell ? '--df-riss-dunkel' : '--df-riss-hell');
  },

  bauen: function () {
    var grund = kanaeleLesen(this.grund()), tinte = kanaeleLesen(this.tinte());
    this.leiter = RISS_ANTEILE.map(function (anteil) {
      return kanaeleSchreiben([
        tinte[0] * anteil + grund[0] * (1 - anteil),
        tinte[1] * anteil + grund[1] * (1 - anteil),
        tinte[2] * anteil + grund[2] * (1 - anteil)
      ]);
    });
  },

  /* Stufe 1 bis 6 */
  riss: function (stufe) {
    if (!this.leiter) this.bauen();
    return this.leiter[Math.max(1, Math.min(RISS_ANTEILE.length, stufe)) - 1];
  }
};

/* Schriftgrade der Zeichenflaeche kommen aus derselben Leiter wie die
   Oberflaeche. Gelesen wird der Token, gerechnet wird mit der Zahl. */
function stufePx(name) {
  var wert = parseFloat(Farbe.lies(name));
  return isFinite(wert) && wert > 0 ? wert : 13;
}

var Farbe = {
  ablage: {},
  lies: function (name) {
    if (!(name in this.ablage)) {
      var wert = '';
      try {
        wert = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      } catch (fehler) { wert = ''; }
      this.ablage[name] = wert;
    }
    return this.ablage[name];
  },
  leeren: function () { this.ablage = {}; Matte.leiter = null; }
};

/* Kleiner DOM-Helfer: el('div', {class:'x'}, [kind, 'Text']) */
function el(name, eigenschaften, kinder) {
  var knoten = document.createElement(name);
  if (eigenschaften) {
    Object.keys(eigenschaften).forEach(function (schluessel) {
      var wert = eigenschaften[schluessel];
      if (wert == null || wert === false) return;
      if (schluessel === 'text') knoten.textContent = wert;
      else if (schluessel === 'html') knoten.innerHTML = wert;
      else if (schluessel.indexOf('on') === 0 && typeof wert === 'function') {
        knoten.addEventListener(schluessel.slice(2), wert);
      } else if (schluessel === 'class') knoten.className = wert;
      else knoten.setAttribute(schluessel, wert === true ? '' : wert);
    });
  }
  if (kinder) {
    (Array.isArray(kinder) ? kinder : [kinder]).forEach(function (kind) {
      if (kind == null || kind === false) return;
      knoten.appendChild(typeof kind === 'string' ? document.createTextNode(kind) : kind);
    });
  }
  return knoten;
}

function leeren(knoten) {
  while (knoten.firstChild) knoten.removeChild(knoten.firstChild);
}

/* ---------- 2. Geraetetabelle und Uebertragungscode ---------------------- */

var GERAETE = [
  {
    id: 'mba13',
    name: 'MacBook Air 13" (M2 bis M5)',
    kurzeKanteMm: 188.7,
    langeKanteMm: 290.3,
    signaturen: [
      // macOS bietet mehrere Skalierungsstufen an, alle gehoeren zum selben Panel
      { kurz: 956,  lang: 1470, dpr: 2 },   // Standardeinstellung, verifiziert
      { kurz: 900,  lang: 1382, dpr: 2 },
      { kurz: 1050, lang: 1614, dpr: 2 },
      { kurz: 1117, lang: 1710, dpr: 2 },
      { kurz: 832,  lang: 1280, dpr: 2 }
    ]
  },
  {
    id: 'mba15',
    name: 'MacBook Air 15"',
    kurzeKanteMm: 211.4,
    langeKanteMm: 326.6,
    signaturen: [{ kurz: 1080, lang: 1710, dpr: 2 }]
  },
  {
    id: 'iphone16pro',
    name: 'iPhone 16 Pro',
    kurzeKanteMm: 66.6,
    langeKanteMm: 144.8,
    geprueft: true,          // mit dem Stahllineal am Geraet gegengeprueft
    signaturen: [{ kurz: 402, lang: 874, dpr: 3 }]
  },
  {
    id: 'iphone16',
    name: 'iPhone 16 / iPhone 15 Pro',
    kurzeKanteMm: 65.1,
    langeKanteMm: 141.1,
    signaturen: [{ kurz: 393, lang: 852, dpr: 3 }]
  }
];

function pruefzeichen(zahl) {
  const summe = String(zahl).split('').reduce((s, z) => s + Number(z), 0);
  return (summe % 36).toString(36).toUpperCase();
}

function codeErzeugen(kurzeKanteMm) {
  const zehntel = Math.round(kurzeKanteMm * 10);
  return 'D' + zehntel + pruefzeichen(zehntel);
}

function codeLesen(code) {
  const treffer = /^D(\d{2,5})([0-9A-Z])$/.exec(code.trim().toUpperCase());
  if (!treffer) return null;
  const zehntel = Number(treffer[1]);
  if (pruefzeichen(zehntel) !== treffer[2]) return null;
  return zehntel / 10;
}

/* ---------- 3. Geraetemodul --------------------------------------------- */

var Geraet = {
  id: null,                 // Kennung aus GERAETE oder 'benutzerdefiniert'
  basisKanteMm: null,       // kurze Bildschirmkante laut Profil oder Kalibrierung
  justierungProzent: 0,     // Feinjustage, plus minus fuenf Prozent
  referenzDpr: null,        // Device-Pixel-Ratio zum Zeitpunkt der Profilwahl
  quelle: 'keine',          // 'gespeichert' | 'erkannt' | 'kalibriert' | 'keine'
  erkannt: null,            // automatisch erkanntes Profil, falls vorhanden

  /* Die kurze CSS-Kante des Bildschirms. Math.min faengt die
     Orientierungsabhaengigkeit unter iOS ab. */
  cssKurzeKante: function () { return Math.min(screen.width, screen.height); },
  cssLangeKante: function () { return Math.max(screen.width, screen.height); },

  signatur: function () {
    return {
      kurz: this.cssKurzeKante(),
      lang: this.cssLangeKante(),
      dpr: window.devicePixelRatio || 1
    };
  },

  /* Wirksame kurze Kante nach Feinjustage. Eine groessere Darstellung
     entspricht einer kleineren angenommenen Kantenlaenge. */
  effektiveKanteMm: function () {
    if (this.basisKanteMm == null) return null;
    return this.basisKanteMm / (1 + this.justierungProzent / 100);
  },

  istKalibriert: function () { return this.basisKanteMm != null; },

  pxProMm: function () {
    var kante = this.effektiveKanteMm();
    if (!kante) return 96 / 25.4;   // Notwert, nur bis zur Kalibrierung
    return this.cssKurzeKante() / kante;
  },

  profil: function () {
    var eintrag = null;
    for (var i = 0; i < GERAETE.length; i++) {
      if (GERAETE[i].id === this.id) { eintrag = GERAETE[i]; break; }
    }
    var kurz = this.effektiveKanteMm();
    var lang = null;
    if (kurz) lang = this.cssLangeKante() / this.pxProMm();
    return {
      id: this.id || 'unbekannt',
      name: eintrag ? eintrag.name : (this.id === 'benutzerdefiniert' ? 'Benutzerdefiniert' : 'Nicht kalibriert'),
      kurzeKanteMm: kurz,
      langeKanteMm: lang,
      tabellenwert: eintrag ? eintrag : null,
      quelle: this.quelle,
      justierungProzent: this.justierungProzent
    };
  },

  erkennen: function () {
    var eigene = this.signatur();
    for (var i = 0; i < GERAETE.length; i++) {
      var geraet = GERAETE[i];
      for (var j = 0; j < geraet.signaturen.length; j++) {
        var s = geraet.signaturen[j];
        if (s.kurz === eigene.kurz && s.lang === eigene.lang && Math.abs(s.dpr - eigene.dpr) < 0.01) {
          return geraet;
        }
      }
    }
    return null;
  },

  aufTabelle: function (id, quelle) {
    for (var i = 0; i < GERAETE.length; i++) {
      if (GERAETE[i].id === id) {
        this.id = id;
        this.basisKanteMm = GERAETE[i].kurzeKanteMm;
        this.justierungProzent = 0;
        this.referenzDpr = window.devicePixelRatio || 1;
        this.quelle = quelle || 'gespeichert';
        this.sichern();
        Aenderung.melden('profil');
        return true;
      }
    }
    return false;
  },

  aufMass: function (kurzeKanteMm, quelle) {
    if (!(kurzeKanteMm > 0)) return false;
    this.id = 'benutzerdefiniert';
    this.basisKanteMm = kurzeKanteMm;
    this.justierungProzent = 0;
    this.referenzDpr = window.devicePixelRatio || 1;
    this.quelle = quelle || 'kalibriert';
    this.sichern();
    Aenderung.melden('profil');
    return true;
  },

  justierungSetzen: function (prozent) {
    prozent = Math.max(-5, Math.min(5, prozent));
    this.justierungProzent = Math.round(prozent * 100) / 100;
    this.sichern();
    Aenderung.melden('profil');
  },

  code: function () {
    var kante = this.effektiveKanteMm();
    return kante ? codeErzeugen(kante) : null;
  },

  sichern: function () {
    Speicher.schreiben('geraet', {
      id: this.id,
      basisKanteMm: this.basisKanteMm,
      justierungProzent: this.justierungProzent,
      referenzDpr: this.referenzDpr,
      quelle: this.quelle
    });
  },

  /* Reihenfolge: gespeicherte Nutzerauswahl, dann Erkennung, dann Kalibrierung. */
  starten: function () {
    this.erkannt = this.erkennen();

    var gespeichert = Speicher.lesen('geraet', null);
    if (gespeichert && gespeichert.basisKanteMm > 0) {
      this.id = gespeichert.id;
      this.basisKanteMm = gespeichert.basisKanteMm;
      this.justierungProzent = gespeichert.justierungProzent || 0;
      this.referenzDpr = gespeichert.referenzDpr || (window.devicePixelRatio || 1);
      this.quelle = 'gespeichert';
      return;
    }

    if (this.erkannt) {
      this.id = this.erkannt.id;
      this.basisKanteMm = this.erkannt.kurzeKanteMm;
      this.justierungProzent = 0;
      this.referenzDpr = window.devicePixelRatio || 1;
      this.quelle = 'erkannt';
      this.sichern();
      return;
    }

    this.quelle = 'keine';   // Kalibrierung erforderlich
  }
};

/* ---------- 4. Zoom-Ueberwachung ---------------------------------------- */

var Zoom = {
  letzterZustand: null,

  /* iOS Safari bietet keinen Weg, einen mit zwei Fingern erzeugten Zoom aus
     dem Skript heraus zurueckzusetzen: visualViewport ist nur lesbar, und
     scrollTo aendert die Vergroesserung nicht. Was hilft, ist das kurze
     Setzen einer Obergrenze im Viewport-Vermerk; Safari zieht die Ansicht
     dann auf die Ausgangsgroesse zurueck. Die Obergrenze wird sofort wieder
     entfernt, damit das Vergroessern nicht dauerhaft gesperrt bleibt.
     Weil dieser Weg nicht auf jeder Fassung greift, steht der Handweg
     immer daneben. */
  RUECKWEG: 'Falls das nicht wirkt: mit zwei Fingern zusammenziehen oder ' +
            'zweimal auf die Fläche tippen.',

  zuruecksetzen: function () {
    try {
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      var vermerk = document.querySelector('meta[name="viewport"]');
      if (!vermerk) return false;
      var vorher = vermerk.getAttribute('content');
      vermerk.setAttribute('content',
        'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
      setTimeout(function () { vermerk.setAttribute('content', vorher); }, 320);
      return true;
    } catch (fehler) {
      return false;
    }
  },

  pruefen: function () {
    var sicht = window.visualViewport;
    if (sicht && typeof sicht.scale === 'number' && Math.abs(sicht.scale - 1) > 0.01) {
      return {
        ok: false,
        art: 'pinch',
        text: 'Die Ansicht ist um den Faktor ' + zahlSchreiben(sicht.scale, 2) +
              ' gespreizt. Angezeigte Maße sind verfälscht. Ansicht mit zwei Fingern ' +
              'auf die Ausgangsgröße zurückziehen.'
      };
    }

    var dpr = window.devicePixelRatio || 1;
    if (Geraet.referenzDpr && Math.abs(dpr - Geraet.referenzDpr) > 0.01) {
      return {
        ok: false,
        art: 'browser',
        text: 'Der Browser-Zoom weicht vom kalibrierten Zustand ab (' +
              zahlSchreiben(dpr, 2) + ' statt ' + zahlSchreiben(Geraet.referenzDpr, 2) +
              '). Zoom mit Befehl und Null, unter Windows mit Strg und Null, zurücksetzen.'
      };
    }

    return { ok: true, art: null, text: '' };
  },

  starten: function () {
    var selbst = this;
    var pruefLauf = function () {
      var zustand = selbst.pruefen();
      var kennung = zustand.ok ? 'ok' : zustand.art + '|' + zustand.text;
      if (kennung !== selbst.letzterZustand) {
        selbst.letzterZustand = kennung;
        Aenderung.melden('zoom');
      } else {
        Aenderung.melden('groesse');

      var gemessen = block.scrollWidth;
      if (!(gemessen > 0)) { block.style.fontSize = ''; return; }
      var groesse = 100 * innen / gemessen * ANTEIL;
      block.style.fontSize = Math.min(160 * ANTEIL, Math.max(44 * ANTEIL, groesse)) + 'px';
    }

/* ---------- 7. Zeichenhilfen -------------------------------------------- */

/* Alle Angaben in CSS-Pixeln. Positionen werden so gerundet, dass Linien auf
   ganzen Geraetepixeln liegen. Keine Verlaeufe, keine Weichzeichnung,
   keine Deckkraft unter hundert Prozent. */
function Zeichner(ctx, dpr) {
  this.ctx = ctx;
  this.dpr = dpr;
  this.duenn = 1 / dpr;              // genau ein physisches Geraetepixel
}

Zeichner.prototype.scharf = function (wert) {
  return (Math.round(wert * this.dpr) + 0.5) / this.dpr;
};

Zeichner.prototype.ganz = function (wert) {
  return Math.round(wert * this.dpr) / this.dpr;
};

Zeichner.prototype.linie = function (x1, y1, x2, y2, farbe, breite) {
  var ctx = this.ctx;
  var stark = Math.max(this.duenn, breite || this.duenn);
  var geradeAnzahl = Math.round(stark * this.dpr) % 2 === 0;
  var xa = x1, xb = x2, ya = y1, yb = y2;
  if (Math.abs(x1 - x2) < 0.001) {          // senkrecht
    xa = xb = geradeAnzahl ? this.ganz(x1) : this.scharf(x1);
    ya = this.ganz(y1); yb = this.ganz(y2);
  } else if (Math.abs(y1 - y2) < 0.001) {   // waagerecht
    ya = yb = geradeAnzahl ? this.ganz(y1) : this.scharf(y1);
    xa = this.ganz(x1); xb = this.ganz(x2);
  }
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = farbe;
  ctx.lineWidth = stark;
  ctx.beginPath();
  ctx.moveTo(xa, ya);
  ctx.lineTo(xb, yb);
  ctx.stroke();
  ctx.restore();
};

Zeichner.prototype.pfeil = function (x, y, richtungX, richtungY, farbe, groesse) {
  var ctx = this.ctx;
  groesse = groesse || 9;
  var breite = groesse * 0.34;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.fillStyle = farbe;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - richtungX * groesse - richtungY * breite, y - richtungY * groesse - richtungX * breite);
  ctx.lineTo(x - richtungX * groesse + richtungY * breite, y - richtungY * groesse + richtungX * breite);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
};

Zeichner.prototype.abgerundetesRechteck = function (x, y, breite, hoehe, radius) {
  var ctx = this.ctx;
  radius = Math.min(radius, breite / 2, hoehe / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + breite - radius, y);
  ctx.arcTo(x + breite, y, x + breite, y + radius, radius);
  ctx.lineTo(x + breite, y + hoehe - radius);
  ctx.arcTo(x + breite, y + hoehe, x + breite - radius, y + hoehe, radius);
  ctx.lineTo(x + radius, y + hoehe);
  ctx.arcTo(x, y + hoehe, x, y + hoehe - radius, radius);
  ctx.lineTo(x, y + radius);
  ctx.arcTo(x, y, x + radius, y, radius);
  ctx.closePath();
};

Zeichner.prototype.text = function (inhalt, x, y, farbe, ausrichtung, grundlinie, groesse, fett) {
  var ctx = this.ctx;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.fillStyle = farbe;
  ctx.font = (fett ? '600 ' : '') + (groesse || stufePx('--df-t2')) + 'px system-ui, sans-serif';
  ctx.textAlign = ausrichtung || 'center';
  ctx.textBaseline = grundlinie || 'alphabetic';
  ctx.fillText(inhalt, x, y);
  ctx.restore();
};

/* ---------- 8. Werkzeug "Anriss" ---------------------------------------- */

/* Alle Masse werden in Millimetern gefuehrt, auch im Zollmodus. Umgerechnet
   wird erst bei der Anzeige, damit ein Wechsel der Einheit die physische
   Groesse nicht antastet. */
var EINHEITEN = {
  mm: {
    id: 'mm', kuerzel: 'mm', proEinheitMm: 1, stellen: 1,
    fein: 1, mittel: 5, grob: 10,
    schritte: [0.1, 1, 10],
    tastatur: { normal: 1, gross: 10, klein: 0.1 }
  },
  zoll: {
    id: 'zoll', kuerzel: '″', proEinheitMm: 25.4, stellen: 3,
    fein: 1 / 16, mittel: 1 / 4, grob: 1,
    schritte: [0.001, 0.01, 0.1],
    tastatur: { normal: 0.01, gross: 0.1, klein: 0.001 }
  }
};

/* Naechster gebraeuchlicher Bruch, gerechnet in Vierundsechzigsteln und
   anschliessend gekuerzt: 1,969 wird zu 1 31/32. */
function zollBruch(zoll) {
  var negativ = zoll < 0;
  var n = Math.round(Math.abs(zoll) * 64);
  var ganz = Math.floor(n / 64);
  var rest = n % 64;
  var nenner = 64;
  while (rest > 0 && rest % 2 === 0) { rest /= 2; nenner /= 2; }
  var text;
  if (rest === 0) text = String(ganz);
  else if (ganz === 0) text = rest + '/' + nenner;
  else text = ganz + ' ' + rest + '/' + nenner;
  return (negativ ? '−' : '') + text + '″';
}

/* Schrittweite lesbar schreiben, ohne haengende Nullen */
function schrittText(wert) {
  return String(wert).replace('.', ',');
}

var AnrissWerkzeug = {

  STARTREIHE_MM: [10, 20, 25, 50, 100, 150, 200],

  rundesMassFuer: function (streckePx) {
